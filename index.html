    <!-- Critical inline CSS for immediate first paint -->
    <style>
      :root {
        --background: 40 20% 98%;
        --foreground: 220 25% 12%;
        --primary: 168 65% 38%;
      }
      body {
        margin: 0;
        background-color: hsl(40, 20%, 98%);
        color: hsl(220, 25%, 12%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Spinner for initial load */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: '';
        width: 2rem;
        height: 2rem;
        border: 2px solid transparent;
        border-bottom-color: hsl(168, 65%, 38%);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
